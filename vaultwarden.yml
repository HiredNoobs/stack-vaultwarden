services:
  vaultwarden:
    hostname: vaultwarden{{.Task.Slot}}
    image: $VAULTWARDEN_IMAGE
    ports:
      - mode: host
        published: $VAULTWARDEN_PORT
        target: 80
        protocol: tcp
    volumes:
      - vaultwarden_data:/data
    environment:
      DOMAIN: "https://vaultwarden.$DOMAIN"
      SIGNUPS_ALLOWED: "false"
    deploy:
      mode: replicated
      replicas: $VAULTWARDEN_REPLICAS
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.labels.${STACK}_vaultwarden == 1

volumes:
  vaultwarden_data:
